services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: .env
    expose:
      - "5000"          # acessível só dentro da rede do compose
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    env_file: .env
    environment:
      SERVER_URL: http://server:5000
    ports:
      - "8080:8080"     # http://localhost:8080
    depends_on:
      - server
    restart: unless-stopped
